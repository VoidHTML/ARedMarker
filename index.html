<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR.js - Suivi d'image NFT</title>

    <!-- A-Frame 1.3.0 (compatible AR.js 3.4.5) -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

    <!-- Composant déclaré AVANT la scène : lance / met en pause la vidéo -->
    <script>
        AFRAME.registerComponent('videohandler', {
            init: function () {
                var marker = this.el;
                this.vid = document.querySelector("#vid");

                marker.addEventListener('markerFound', function () {
                    this.vid.play();
                }.bind(this));

                marker.addEventListener('markerLost', function () {
                    this.vid.pause();
                }.bind(this));
            }
        });
    </script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        .message {
            position: absolute;
            bottom: 10%;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 1em;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="message">Pointez la caméra vers la fresque</div>

    <a-scene vr-mode-ui="enabled: false;" renderer="logarithmicDepthBuffer: true;" embedded arjs="trackingMethod: best; sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false;">
        <a-assets>
            <!-- ton GIF converti en MP4 -->
            <video id="vid" src="assets/anim.mp4" preload="auto" loop crossorigin webkit-playsinline muted playsinline></video>
        </a-assets>

        <!-- NFT Marker : URL ABSOLUE vers tes descripteurs a.fset / a.fset3 / a.iset (SANS extension) -->
        <a-nft type="nft" url="https://voidhtml.github.io/ARedMarker/assets/a" videohandler smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">
            <a-video src="#vid" width="300" height="175" position="50 0 -50" rotation="-90 0 0"></a-video>
        </a-nft>

        <!-- Caméra -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // --- Messages du marker ---
        const message = document.querySelector('.message');
        const nftMarker = document.querySelector('a-nft');

        nftMarker.addEventListener('markerFound', () => {
            message.style.display = 'none';
        });
        nftMarker.addEventListener('markerLost', () => {
            message.style.display = 'block';
        });
    </script>

    <!-- Console de debug mobile : à SUPPRIMER une fois que tout marche -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</body>
</html>
