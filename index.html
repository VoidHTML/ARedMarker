<!-- import aframe and then ar.js with image tracking / location based features -->
<script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

<script>
  AFRAME.registerComponent('videohandler', {
    init: function () {
      var marker = this.el;
      this.vid = document.querySelector("#vid");

      marker.addEventListener('markerFound', function () {
        this.vid.play();
      }.bind(this));

      marker.addEventListener('markerLost', function () {
        this.vid.pause();
      }.bind(this));
    },
  });
</script>

<!-- style for the loader -->
<style>
  .arjs-loader {
    height: 100%;
    width: 100%;
    position: absolute;
    top: 0;
    left: 0;
    background-color: rgba(0, 0, 0, 0.8);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .arjs-loader div {
    text-align: center;
    font-size: 1.25em;
    color: white;
  }
</style>

<body style="margin : 0px; overflow: hidden;">
  <!-- minimal loader shown until image descriptors are loaded -->
  <div class="arjs-loader">
    <div>Loading, please wait...</div>
  </div>

  <!-- a-frame scene -->
  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam;debugUIEnabled: false;"
  >
    <a-assets>
      <video id="vid" src="assets/asset.mp4" preload="auto" loop crossorigin
        webkit-playsinline muted playsinline></video>
    </a-assets>

    <!-- a-nft is the anchor that defines an Image Tracking entity -->
    <a-nft
      type="nft"
      url="assets/a"
      videohandler
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <!-- la vidéo remplace l'objet 3D (comme proposé à la fin du TD) -->
      <a-video
        src="#vid"
        width="300"
        height="175"
        position="50 150 0"
        rotation="-90 0 0"
      ></a-video>
    </a-nft>

    <!-- static camera that moves according to the device movements -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
