<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- A-Frame 1.6.0 + AR.js 3.4.8 (versions compatibles) -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar-nft.js"></script>

    <script>
        // Lance la vidéo quand la fresque est reconnue, pause quand elle est perdue
        AFRAME.registerComponent('videohandler', {
            init: function () {
                var marker = this.el;
                this.vid = document.querySelector("#vid");

                marker.addEventListener('markerFound', function () {
                    this.vid.play();
                }.bind(this));

                marker.addEventListener('markerLost', function () {
                    this.vid.pause();
                }.bind(this));
            }
        });
    </script>

    <style>
        .arjs-loader {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .arjs-loader div {
            text-align: center;
            font-size: 1.25em;
            color: white;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">
    <div class="arjs-loader">
        <div>Loading, please wait...</div>
    </div>

    <a-scene vr-mode-ui="enabled: false;" renderer="logarithmicDepthBuffer: true; precision: medium;" embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <video id="vid" src="assets/asset.mp4" preload="auto" loop crossorigin
                webkit-playsinline muted playsinline></video>
        </a-assets>

        <!-- descripteurs : assets/a.fset, a.fset3, a.iset -> url SANS extension -->
        <a-nft type="nft" url="assets/a" videohandler
            smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">
            <a-video src="#vid" width="300" height="175" position="50 150 -100" rotation="90 0 180"></a-video>
        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
